<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css">
<style>.card{padding:16px;margin-bottom:12px}.mpesa-input{width:100%;background:#0e0e12;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;margin:6px 0}</style>
<script>
let exp=parseInt(localStorage.getItem('session_expiry')||'0');
if(localStorage.getItem('loggedIn')!=='true' || Date.now()>exp || !exp) location.href='index.html';
else localStorage.setItem('session_expiry', Date.now()+30*60*1000);
</script>
</head><body>
<div class="topbar"><div class="logo"> KEVIN TRADE<span>HUB</span> KE</div><div class="nav"><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><a class="active">Wallet</a><a href="#" onclick="localStorage.removeItem('loggedIn');location.href='index.html'">Logout</a></div></div>

<div style="padding:12px;max-width:500px;margin:0 auto">
<div class="card" style="text-align:center"><p style="opacity:0.6;font-size:12px">Available Balance</p><h1 style="font-size:32px;margin:6px 0" id="balDisplay">$0.00</h1><p id="kesBal" style="opacity:0.6">KES 0</p></div>

<div class="card" style="border:1px solid #0ecb81">
<h3 style="color:#0ecb81">💚 Lipa na M-Pesa - Real STK Push</h3>
<p style="font-size:11px;opacity:0.6;margin:6px 0">Amount to be deposited</p>
<input id="mpesaPhone" class="mpesa-input" placeholder="Safaricom: 254712345678" value="254792139891">
<input id="mpesaAmount" class="mpesa-input" type="number" placeholder="Amount KES min 10" value="100">
<button id="depositBtn" onclick="realMpesaDeposit()" style="width:100%;background:#0ecb81;border:none;padding:14px;border-radius:8px;font-weight:900;color:#fff;font-size:16px;margin-top:8px">DEPOSIT TO ACCOUNT 📲</button>
<p id="stkStatus" style="font-size:12px;margin-top:8px;text-align:center"></p>
</div>

<!-- WITHDRAWAL SECTION -->
<div style="background:rgba(0,0,0,0.5);border:1px solid rgba(240,185,11,0.15);padding:16px;border-radius:14px;margin-top:14px">
<div style="display:flex;justify-content:space-between;margin-bottom:10px">
<b style="font-size:13px"><i class="fas fa-arrow-up" style="color:#f6465d"></i> WITHDRAW TO M-PESA</b>
<span style="font-size:10px;opacity:0.5">Min KES 100 • Max 70k</span>
</div>
<input id="wdPhone" class="mpesa-input" placeholder="M-Pesa No 2547XXXXXXXX" value="254792139891">
<input id="wdAmount" class="mpesa-input" type="number" placeholder="Amount KES">
<button id="wdBtn" onclick="withdrawMpesa()" style="width:100%;padding:13px;background:#0e0e14;border:1px solid #f6465d;color:#f6465d;border-radius:10px;font-weight:900;margin-top:8px;cursor:pointer">WITHDRAW NOW 💸</button>
<p id="wdStatus" style="font-size:11px;margin-top:8px;display:none"></p>
</div>

<div class="card"><h3>Transactions</h3><div id="txList" style="font-size:12px;margin-top:8px"></div></div>
</div>

<script>

// Baada ya kuhost kwa Render, badilisha kuwa:
 const BACKEND_URL = "https://tradehub-ke.onrender.com";
// =========================================

function updateBal(){
 let bal=parseFloat(localStorage.getItem('balance')||0);
 let avail=parseFloat(localStorage.getItem('availBalance')||bal);
 document.getElementById('balDisplay').innerText='$'+bal.toFixed(2);
 document.getElementById('kesBal').innerText='KES '+(bal*129.5).toFixed(2)+' | Avail: '+(avail*129.5).toFixed(0);
 let deps=JSON.parse(localStorage.getItem('deposits')||'[]');
 document.getElementById('txList').innerHTML=deps.slice(-10).reverse().map(d=>`
  <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1e1e2a">
   <span>${d.amount>0?'Deposit':'Withdraw'} • ${d.phone||''}<br><small style="opacity:0.5">${d.status||'completed'} - ${new Date(d.time||Date.now()).toLocaleTimeString()}</small></span>
   <span style="color:${d.amount>0?'#0ecb81':'#f6465d'}">${d.amount>0?'+':''}KES ${(Math.abs(d.amount)*129.5).toFixed(0)}</span>
  </div>`).join('') || '<p style="opacity:0.5">No transactions yet</p>';
}

async function realMpesaDeposit(){
 let phone=document.getElementById('mpesaPhone').value.trim();
 let amount=document.getElementById('mpesaAmount').value.trim();
 let btn=document.getElementById('depositBtn');
 let status=document.getElementById('stkStatus');
 
 if(!phone.startsWith('254') || phone.length!=12){ alert('Enter valid phone number 254792139891'); return; }
 if(parseInt(amount)<10){ alert('Min KES 10'); return; }
 
 btn.innerText='STK sent...'; btn.disabled=true; status.innerText='⏳ sending request to Safaricom...';
 
 try{
   let res=await fetch(BACKEND_URL+'/deposit',{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({ phone: phone, amount: parseInt(amount) })
   });
   let data=await res.json();
   console.log(data);
   
   if(data.success){
     status.innerHTML='<span style="color:#0ecb81">✅ STK Push sent to your phone - please enter M-Pesa PIN.<br><small>CheckoutID: '+(data.data.CheckoutRequestID||'')+'</small></span>';
     let deps=JSON.parse(localStorage.getItem('deposits')||'[]');
     deps.push({amount: parseFloat(amount)/129.5, kes: parseInt(amount), phone, status:'STK Sent - Enter PIN', id:data.data.CheckoutRequestID, time:Date.now()});
     localStorage.setItem('deposits', JSON.stringify(deps));
     // Demo add balance (kwa production ita-add baada ya callback)
     setTimeout(()=>{
       let bal=parseFloat(localStorage.getItem('balance')||0);
       localStorage.setItem('balance', bal + parseFloat(amount)/129.5);
       localStorage.setItem('availBalance', bal + parseFloat(amount)/129.5);
       updateBal();
     }, 3000);
   } else {
     status.innerHTML='<span style="color:#f6465d">❌ Failed: '+(data.error?.errorMessage || JSON.stringify(data))+'</span>';
   }
 }catch(e){
   status.innerHTML='<span style="color:#f6465d">❌ Backend off! run: node server.js <br>'+e.message+'</span>';
 }
 btn.innerText='DEPOSIT TO ACCOUNT 📲'; btn.disabled=false;
}

async function withdrawMpesa(){
 let phone=document.getElementById('wdPhone').value.trim();
 let amount=parseInt(document.getElementById('wdAmount').value);
 let status=document.getElementById('wdStatus');
 let btn=document.getElementById('wdBtn');
 
 if(!phone.startsWith('254') || phone.length!=12){ status.style.display='block'; status.style.color='#f6465d'; status.innerText='Enter valid phone number 254792139891'; return; }
 if(amount<100){ status.style.display='block'; status.innerText='Min 100'; return; }
 let bal=parseFloat(localStorage.getItem('availBalance')|| localStorage.getItem('balance')||'0')*129.5;
 if(amount>bal){ status.style.display='block'; status.innerText='Not enough balance. Avail: KES '+bal.toFixed(0); return; }

 btn.disabled=true; btn.innerText='PROCESSING...';
 status.style.display='block'; status.style.color='#f0b90b'; status.innerText='⏳ sending withdrawal...';

 try{
   let res=await fetch(BACKEND_URL+'/withdraw',{
     method:'POST', headers:{'Content-Type':'application/json'},
     body:JSON.stringify({phone, amount, username:localStorage.getItem('username')})
   });
   let data=await res.json();
   console.log(data);
   if(data.success){
     status.style.color='#0ecb81'; status.innerText='✅ Withdraw in process - get M-Pesa in 30sec';
     let newBal=parseFloat(localStorage.getItem('balance')||0) - amount/129.5;
     localStorage.setItem('balance', newBal);
     localStorage.setItem('availBalance', newBal);
     let deps=JSON.parse(localStorage.getItem('deposits')||'[]');
     deps.push({amount: -amount/129.5, kes: -amount, phone, status:'Withdraw Processing', time:Date.now()});
     localStorage.setItem('deposits', JSON.stringify(deps));
     updateBal();
   }else{
     status.style.color='#f6465d'; status.innerText='❌ '+(data.error?.errorMessage||JSON.stringify(data.error));
   }
 }catch(e){
   status.style.color='#f6465d'; status.innerText='❌ Server error - Confirm node server.js -run';
 }
 btn.disabled=false; btn.innerText='WITHDRAW NOW 💸';
}
updateBal();
</script>

</body>
</html>
