<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#08080c;color:#fff;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;background:#12121a;padding:14px 18px;border-radius:12px;border:1px solid rgba(240,185,11,0.15);margin-bottom:16px}
.logo{font-weight:900}.logo span{color:#f0b90b}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.card{background:#12121a;border:1px solid #1e1e2a;padding:16px;border-radius:12px;text-align:center}.card b{font-size:22px;color:#f0b90b}.card span{font-size:10px;opacity:0.6;display:block}
.table{background:#12121a;border-radius:12px;overflow:hidden;border:1px solid #1e1e2a}
.row{display:grid;grid-template-columns:40px 1.2fr 0.8fr 1fr 150px;gap:8px;padding:12px 14px;border-bottom:1px solid #1e1e2a;font-size:11px;align-items:center}
.row.head{opacity:0.5;font-size:10px;font-weight:800;background:#0e0e14}
.badge{background:rgba(14,203,129,0.15);color:#0ecb81;padding:4px 8px;border-radius:6px;font-size:9px;font-weight:800}
.btn{padding:6px 8px;border-radius:6px;border:none;font-size:9px;font-weight:800;cursor:pointer}
.live{position:fixed;bottom:16px;right:16px;background:#0ecb81;color:#000;padding:10px 14px;border-radius:20px;font-size:11px;font-weight:900;box-shadow:0 0 20px #0ecb81;display:none}
</style>
</head><body>
<div class="top"><div class="logo">KEVIN TRADE<span>HUB</span> - ADMIN</div><div><span style="font-size:11px;opacity:0.6" id="adminUser"></span> • <a href="dashboard.html" style="color:#fff;text-decoration:none;font-size:11px;margin-left:8px">Dashboard</a> <a href="#" onclick="localStorage.removeItem('loggedIn');location.href='index.html'" style="color:#f6465d;text-decoration:none;font-size:11px;margin-left:8px">Logout</a></div></div>

<div class="grid">
<div class="card"><b id="totalUsers">0</b><span>TOTAL USERS</span></div>
<div class="card"><b id="totalBal">0</b><span>TOTAL BAL KES</span></div>
<div class="card"><b id="pendingKyc">0</b><span>PENDING KYC</span></div>
<div class="card"><b id="onlineNow">1</b><span>ONLINE</span></div>
</div>

<div class="table" id="userTable"><div class="row head"><div>#</div><div>USER / BALANCE</div><div>ID NUMBER</div><div>KYC STATUS</div><div>ACTION</div></div></div>
<div id="liveToast" class="live">🟢 New user signed up!</div>

<script>
if(localStorage.getItem('username')!=='vokeh@254' || localStorage.getItem('loggedIn')!=='true'){ location.href='index.html'; }
document.getElementById('adminUser').innerText=localStorage.getItem('username');
let lastCount=0;
const BACKEND_URL="https://tradehub-ke.onrender.com";

async function loadUsers(){
 try{
   let res = await fetch(BACKEND_URL+'/api/users');
   let data = await res.json();
   if(!data.success) return;
   let users = data.users;
   if(lastCount && users.length>lastCount){
     let toast=document.getElementById('liveToast');
     toast.style.display='block'; toast.innerText='🟢 New user! Total: '+users.length;
     setTimeout(()=>toast.style.display='none',4000);
   }
   lastCount=users.length;
   document.getElementById('totalUsers').innerText=users.length;
   document.getElementById('totalBal').innerText=users.reduce((s,u)=>s+(u.balance||0),0).toLocaleString();
   document.getElementById('pendingKyc').innerText=users.filter(u=>u.kycStatus=='pending').length;

   let html='<div class="row head"><div>#</div><div>USER / BALANCE</div><div>ID NUMBER</div><div>KYC STATUS</div><div>ACTION</div></div>';
   users.forEach((u,i)=>{
     let isAdmin=u.phone=='vokeh@254';
     let kycColor = u.kycStatus=='approved'?'#0ecb81':u.kycStatus=='pending'?'#f0b90b':'#f6465d';
     let kycText = (u.kycStatus||'not_verified').toUpperCase();
     html+=`<div class="row">
      <div>${i+1}</div>
      <div><b>${u.phone}</b> ${isAdmin?'<span class="badge">ADMIN</span>':''}<br><b style="color:#f0b90b;font-size:12px">KES ${(u.balance||0).toLocaleString()}</b></div>
      <div>${u.idNumber||'<span style="opacity:0.3">No ID</span>'}<br><span style="font-size:9px;opacity:0.5">${u.kycFrontUrl?'📎 Front':''} ${u.kycBackUrl?'📎 Back':''}</span></div>
      <div><span style="background:${kycColor}22;color:${kycColor};padding:4px 8px;border-radius:6px;font-weight:800">${kycText}</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        <button class="btn" style="background:#f0b90b;color:#000" onclick="addBal('${u._id}','${u.phone}',${u.balance||0})">+ADD</button>
        ${u.kycStatus=='pending'?`<button class="btn" style="background:#0ecb81;color:#fff" onclick="approveKyc('${u._id}','approved')">✔</button><button class="btn" style="background:#f6465d;color:#fff" onclick="approveKyc('${u._id}','rejected')">✘</button>`:''}
        <button class="btn" style="background:#2a2a3a;color:#fff" onclick="deleteUser('${u._id}','${u.phone}')">Del</button>
      </div>
     </div>`;
   });
   document.getElementById('userTable').innerHTML=html;
 }catch(e){ console.log(e); }
}
async function deleteUser(id, name){
 if(name=='vokeh@254'){ alert('you are admin'); return; }
 if(!confirm('Delete '+name+'?')) return;
 await fetch(BACKEND_URL+'/api/users/'+id, {method:'DELETE'});
 loadUsers();
}
async function addBal(id, name, bal){
 let amt = prompt(`Ongeza pesa ngapi kwa ${name}?\nSasa: KES ${bal}`);
 if(!amt) return; amt=parseFloat(amt); if(isNaN(amt)) return alert('Weka number!');
 let res = await fetch(BACKEND_URL+'/api/admin/add-balance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:id, amount:amt})});
 let data = await res.json(); if(data.success){ alert(`✅ ${name} +KES ${amt}`); loadUsers(); }
}
async function approveKyc(id, status){
 if(!confirm(status+' KYC?')) return;
 await fetch(BACKEND_URL+'/api/admin/kyc-approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:id, status})});
 loadUsers();
}
setInterval(loadUsers,4000); loadUsers();
</script>
</body></html>
